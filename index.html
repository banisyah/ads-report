<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Laporan Iklan — wearmodesti</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #F5F3EE;
    --surface:   #FDFCFA;
    --surface2:  #F0EDE7;
    --border:    #E2DDD6;
    --border2:   #CEC9C0;
    --ink:       #1C1A17;
    --ink2:      #5C5850;
    --ink3:      #9C968D;
    --accent:    #C4521A;
    --accent-l:  #F5E8DF;
    --green:     #2A6B3C;
    --green-l:   #E3F0E8;
    --blue:      #1A5C9C;
    --blue-l:    #DDE9F5;
    --amber:     #8C5E00;
    --amber-l:   #FDF3DC;
    --red:       #B02020;
    --shopee:    #EE4D2D;
    --shopee-l:  #FEF0ED;
    --meta:      #0866FF;
    --meta-l:    #E7F0FF;
    --r:         8px;
    --r-lg:      14px;
    --shadow:    0 1px 3px rgba(28,26,23,.08), 0 4px 16px rgba(28,26,23,.04);
  }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  .header {
    background: var(--ink);
    color: #fff;
    padding: 0 48px;
    position: sticky; top: 0; z-index: 100;
  }
  .header-inner {
    max-width: 960px; margin: 0 auto;
    display: flex; align-items: center; justify-content: space-between;
    height: 60px;
  }
  .header-brand { display: flex; align-items: center; gap: 12px; }
  .brand-dot {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent); display: flex; align-items: center;
    justify-content: center; font-size: 14px; flex-shrink: 0;
  }
  .brand-name { font-size: 15px; font-weight: 600; letter-spacing: -.02em; color: #fff; }
  .brand-sub  { font-size: 11px; color: rgba(255,255,255,.45); margin-top: 1px; }
  .report-count {
    font-family: 'DM Mono', monospace;
    font-size: 11px; color: rgba(255,255,255,.55);
    background: rgba(255,255,255,.08);
    border: 1px solid rgba(255,255,255,.12);
    padding: 5px 12px; border-radius: 20px;
  }

  .page { max-width: 960px; margin: 0 auto; padding: 40px 48px 80px; }

  .page-title {
    font-size: 26px; font-weight: 600; letter-spacing: -.03em;
    color: var(--ink); margin-bottom: 6px;
  }
  .page-sub {
    font-size: 13px; color: var(--ink3); margin-bottom: 28px;
  }

  /* Filter tabs */
  .filter-bar {
    display: flex; gap: 6px; margin-bottom: 28px;
  }
  .filter-btn {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; font-weight: 500;
    padding: 6px 14px; border-radius: 20px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--ink2);
    cursor: pointer;
    transition: all .15s;
    display: flex; align-items: center; gap: 6px;
  }
  .filter-btn:hover { border-color: var(--border2); color: var(--ink); }
  .filter-btn.active {
    background: var(--ink); border-color: var(--ink); color: #fff;
  }
  .filter-btn.active.shopee { background: var(--shopee); border-color: var(--shopee); }
  .filter-btn.active.meta   { background: var(--meta);   border-color: var(--meta); }
  .filter-dot {
    width: 6px; height: 6px; border-radius: 50%;
  }
  .filter-btn.shopee .filter-dot { background: var(--shopee); }
  .filter-btn.meta   .filter-dot { background: var(--meta); }
  .filter-btn.active .filter-dot { background: rgba(255,255,255,.7); }

  .section-eyebrow {
    font-size: 10px; font-weight: 600; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink3);
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .section-eyebrow::after {
    content: ''; flex: 1; height: 1px; background: var(--border);
  }

  .report-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px;
  }

  .report-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--r-lg);
    padding: 22px 24px;
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    display: block;
    transition: transform .15s, box-shadow .15s, border-color .15s;
    position: relative;
    overflow: hidden;
  }
  .report-card[data-platform="shopee"]::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--shopee); opacity: 0;
    transition: opacity .15s;
  }
  .report-card[data-platform="meta"]::before {
    content: '';
    position: absolute; top: 0; left: 0; right: 0;
    height: 3px; background: var(--meta); opacity: 0;
    transition: opacity .15s;
  }
  .report-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 6px 24px rgba(28,26,23,.12);
    border-color: var(--border2);
  }
  .report-card:hover::before { opacity: 1; }

  .card-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 2px; }

  .card-period {
    font-size: 16px; font-weight: 600; letter-spacing: -.02em;
    color: var(--ink);
  }

  .platform-badge {
    font-size: 10px; font-weight: 600; letter-spacing: .03em;
    padding: 3px 8px; border-radius: 20px;
    flex-shrink: 0; margin-top: 2px;
  }
  .platform-badge.shopee { background: var(--shopee-l); color: var(--shopee); }
  .platform-badge.meta   { background: var(--meta-l);   color: var(--meta); }

  .card-date {
    font-family: 'DM Mono', monospace;
    font-size: 10px; color: var(--ink3); margin-bottom: 18px;
  }

  .card-stats {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 12px; margin-bottom: 18px;
  }
  .stat-label {
    font-size: 10px; font-weight: 500; color: var(--ink3);
    letter-spacing: .02em; margin-bottom: 3px;
  }
  .stat-value {
    font-family: 'DM Mono', monospace;
    font-size: 15px; font-weight: 500; color: var(--ink);
    line-height: 1;
  }
  .stat-value.green  { color: var(--green); }
  .stat-value.accent { color: var(--accent); }

  .card-footer {
    display: flex; align-items: center; justify-content: space-between;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .card-created { font-size: 11px; color: var(--ink3); }
  .card-arrow {
    width: 26px; height: 26px; border-radius: 50%;
    background: var(--surface2); border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; color: var(--ink2);
    transition: background .15s, border-color .15s, color .15s;
  }
  .report-card:hover .card-arrow {
    background: var(--ink); border-color: var(--ink); color: #fff;
  }

  .roas-pill {
    font-family: 'DM Mono', monospace;
    font-size: 10px; font-weight: 500;
    padding: 3px 8px; border-radius: 6px;
  }
  .roas-5 { background: var(--green-l); color: var(--green); }
  .roas-3 { background: var(--blue-l);  color: var(--blue); }
  .roas-1 { background: var(--amber-l); color: var(--amber); }
  .roas-0 { background: #FAE8E8;        color: var(--red); }

  .empty-state {
    grid-column: 1 / -1;
    text-align: center; padding: 60px 24px; color: var(--ink3);
  }
  .empty-state .icon { font-size: 36px; margin-bottom: 12px; }
  .empty-state p { font-size: 13px; }

  .footer {
    margin-top: 56px; padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex; justify-content: space-between;
    font-size: 11px; color: var(--ink3);
    font-family: 'DM Mono', monospace;
  }

  .hidden { display: none !important; }

  @media (max-width: 768px) {
    .page { padding: 24px 20px 60px; }
    .header { padding: 0 20px; }
    .report-grid { grid-template-columns: 1fr; }
    .footer { flex-direction: column; gap: 4px; }
  }
</style>
</head>
<body>

<header class="header">
  <div class="header-inner">
    <div class="header-brand">
      <div class="brand-dot">📊</div>
      <div>
        <div class="brand-name">wearmodesti</div>
        <div class="brand-sub">Direktori Laporan Iklan</div>
      </div>
    </div>
    <div class="report-count" id="report-count">— laporan</div>
  </div>
</header>

<div class="page">
  <h1 class="page-title">Laporan Iklan</h1>
  <p class="page-sub">Pilih periode untuk melihat laporan lengkap performa iklan.</p>

  <div class="filter-bar" id="filter-bar">
    <button class="filter-btn active" data-filter="all">Semua</button>
    <button class="filter-btn shopee" data-filter="shopee">
      <span class="filter-dot"></span>Shopee
    </button>
    <button class="filter-btn meta" data-filter="meta">
      <span class="filter-dot"></span>Meta
    </button>
  </div>

  <p class="section-eyebrow" id="section-label">Semua Laporan</p>
  <div class="report-grid" id="report-grid"></div>

  <div class="footer">
    <span>wearmodesti</span>
    <span>Shopee · Meta Ads</span>
  </div>
</div>

<script src="reports.js"></script>
<script>
  const grid = document.getElementById('report-grid');
  const countEl = document.getElementById('report-count');
  const sectionLabel = document.getElementById('section-label');

  const PLATFORM_LABEL = { shopee: 'Shopee', meta: 'Meta Ads' };

  function renderCards(filter) {
    const sorted = [...REPORTS].reverse();
    const filtered = filter === 'all' ? sorted : sorted.filter(r => r.platform === filter);

    grid.innerHTML = '';

    if (filtered.length === 0) {
      grid.innerHTML = `<div class="empty-state"><div class="icon">📋</div><p>Tidak ada laporan untuk platform ini.</p></div>`;
      return;
    }

    filtered.forEach(r => {
      const card = document.createElement('a');
      card.href = r.file;
      card.className = 'report-card';
      card.dataset.platform = r.platform;
      card.innerHTML = `
        <div class="card-header">
          <div class="card-period">${r.period}</div>
          <span class="platform-badge ${r.platform}">${PLATFORM_LABEL[r.platform] || r.platform}</span>
        </div>
        <div class="card-date">${r.dateLabel}</div>
        <div class="card-stats">
          <div>
            <div class="stat-label">Penjualan Iklan</div>
            <div class="stat-value accent">${r.highlights.revenue}</div>
          </div>
          <div>
            <div class="stat-label">ROAS</div>
            <div class="stat-value green">${r.highlights.roas}</div>
          </div>
          <div>
            <div class="stat-label">Total Spend</div>
            <div class="stat-value">${r.highlights.spend}</div>
          </div>
          <div>
            <div class="stat-label">Pesanan</div>
            <div class="stat-value">${r.highlights.orders}</div>
          </div>
        </div>
        <div class="card-footer">
          <span class="card-created">Dibuat ${r.created}</span>
          <span class="card-arrow">→</span>
        </div>
      `;
      grid.appendChild(card);
    });
  }

  // Filter logic
  let activeFilter = 'all';

  document.getElementById('filter-bar').addEventListener('click', e => {
    const btn = e.target.closest('[data-filter]');
    if (!btn) return;
    activeFilter = btn.dataset.filter;

    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    const labels = { all: 'Semua Laporan', shopee: 'Laporan Shopee', meta: 'Laporan Meta Ads' };
    sectionLabel.textContent = labels[activeFilter] || 'Semua Laporan';

    renderCards(activeFilter);
  });

  // Init
  countEl.textContent = REPORTS.length + ' laporan';
  renderCards('all');
</script>
</body>
</html>
